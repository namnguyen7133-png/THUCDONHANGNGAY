<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Danh Sách Trang - Tổng Hợp</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0; padding: 20px;
            background: #f4f6f9; color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #2c3e50; text-align: center; margin: 0 0 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; min-height: 24px; }
        .subtitle b { color: #2c3e50; }
        .search-wrap { position: sticky; top: 0; background: #f4f6f9; padding: 10px 0 20px; z-index: 10; }
        .search {
            width: 100%; padding: 14px 18px; font-size: 16px;
            border: 2px solid #d0d7de; border-radius: 10px;
            outline: none; transition: border-color .2s; background: #fff;
        }
        .search:focus { border-color: #2c3e50; }
        .search:disabled { opacity: .5; cursor: not-allowed; }
        .folder { margin-bottom: 30px; }
        .folder-title {
            color: #2c3e50; font-size: 20px; padding-bottom: 8px;
            border-bottom: 2px solid #e1e4e8; margin: 0 0 15px;
        }
        .count { color: #888; font-weight: normal; font-size: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .card {
            display: flex; flex-direction: column; background: #fff;
            border: 1px solid #e1e4e8; border-radius: 10px;
            padding: 16px; text-decoration: none; color: inherit;
            transition: transform .15s, box-shadow .15s, border-color .15s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            border-color: #2c3e50;
        }
        .card-icon { font-size: 28px; margin-bottom: 8px; }
        .card-title {
            font-weight: 600; font-size: 15px; color: #2c3e50;
            margin-bottom: 4px; word-break: break-word;
        }
        .card-path {
            font-size: 11px; color: #aaa; word-break: break-all;
            font-family: ui-monospace, Consolas, monospace;
        }
        .empty, .error {
            text-align: center; padding: 40px; border-radius: 10px;
            background: #fff; color: #666;
        }
        .error { color: #c0392b; border: 1px solid #f8d7da; background: #fff5f5; text-align: left; }
        .error h3 { margin-top: 0; color: #c0392b; }
        .error code { background: #fef0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid #ddd; border-top-color: #2c3e50;
            border-radius: 50%; animation: spin .8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            body { padding: 12px; }
            h1 { font-size: 22px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .card { padding: 12px; }
            .card-icon { font-size: 22px; }
            .card-title { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Danh Sách Trang</h1>
    <p class="subtitle" id="status">
        <span class="spinner"></span> Đang tải danh sách từ GitHub...
    </p>
    <div class="search-wrap">
        <input type="text" class="search" id="search"
               placeholder="🔍 Tìm theo tên hoặc đường dẫn..." disabled>
    </div>
    <div id="sections"></div>
</div>

<script>
(function () {
    'use strict';

    // ============================================================
    // ĐÃ SỬA ĐÚNG TÊN TÀI KHOẢN CỦA BẠN (có chữ -png)
    // ============================================================
    var CONFIG = {
        owner: 'namnguyen7133-png',   // Đã sửa lại đúng
        repo:  'THUCDONHANGNGAY',     // Tên repo
        branch: 'main',               // Nhánh chứa code
        subfolder: ''                 
    };

    var SKIP_PREFIXES = [
        '.git/', '.github/', 'node_modules/', '__pycache__/',
        'venv/', '.venv/', 'env/', 'dist/', 'build/',
        '_site/', 'site-packages/', '.cache/', '.idea/', '.vscode/'
    ];

    function shouldSkip(path) {
        if (path.indexOf('.') === 0) return true;
        if (path.indexOf('/.') !== -1) return true;
        for (var i = 0; i < SKIP_PREFIXES.length; i++) {
            if (path.indexOf(SKIP_PREFIXES[i]) === 0) return true;
        }
        return false;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                     '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function pickIcon(stem) {
        var s = stem.toLowerCase();
        if (/(thoi-tiet|thoitiet|weather|mon-an)/.test(s)) return '⛅';
        if (/(thuc-don|food|an-uong)/.test(s))            return '🍲';
        if (/(suc-khoe|health|y-te)/.test(s))             return '💊';
        if (/(lich|calendar)/.test(s))                    return '📅';
        if (/(tin-tuc|news)/.test(s))                     return '📰';
        if (/(bai-tap|the-duc|gym)/.test(s))              return '🏋️';
        if (/(hoc|study|sach)/.test(s))                   return '📚';
        return '📄';
    }

    function prettyName(stem) {
        var name = stem.replace(/^\s*\d+[\s\-_.]*/, '');
        name = name.replace(/[-_]+/g, ' ');
        name = name.replace(/\s+/g, ' ').trim();
        if (!name) return stem;
        return name.replace(/\S+/g, function (w) {
            return w.charAt(0).toUpperCase() + w.slice(1);
        });
    }

    function fetchTree(owner, repo, branch) {
        var api = 'https://api.github.com/repos/' +
                  encodeURIComponent(owner) + '/' +
                  encodeURIComponent(repo) + '/git/trees/' +
                  encodeURIComponent(branch) + '?recursive=1';
        return fetch(api, {
            headers: { 'Accept': 'application/vnd.github+json' }
        }).then(function (r) {
            if (r.status === 403) {
                throw new Error(
                    'GitHub API từ chối (403) — có thể đã hết rate-limit ' +
                    '60 req/giờ, chờ vài phút rồi tải lại.'
                );
            }
            if (r.status === 404) {
                throw new Error('Không tìm thấy repo hoặc branch: ' +
                                owner + '/' + repo + '@' + branch);
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        });
    }

    function render(htmlFiles, owner, repo) {
        var items = htmlFiles.filter(function (p) {
            return p !== 'index.html' && p !== './index.html';
        });

        var groups = {};
        items.forEach(function (p) {
            var idx = p.lastIndexOf('/');
            var folder = idx === -1 ? '' : p.slice(0, idx);
            (groups[folder] = groups[folder] || []).push(p);
        });

        var folders = Object.keys(groups).sort(function (a, b) {
            if (a === '') return -1;
            if (b === '') return 1;
            return a.localeCompare(b);
        });

        var html = '';
        folders.forEach(function (folder) {
            var label = folder === ''
                ? '📂 Thư mục gốc'
                : '📁 ' + escapeHtml(folder);
            var cards = groups[folder].sort().map(function (p) {
                var base = p.slice(p.lastIndexOf('/') + 1);
                var stem = base.replace(/\.html?$/i, '');
                var icon = pickIcon(stem);
                var nice = prettyName(stem);
                return '<a href="' + escapeHtml(p) + '" class="card" ' +
                       'data-search="' +
                       escapeHtml(p.toLowerCase()) + ' ' +
                       escapeHtml(nice.toLowerCase()) + '">' +
                       '<div class="card-icon">' + icon + '</div>' +
                       '<div class="card-title">' +
                       escapeHtml(nice) + '</div>' +
                       '<div class="card-path">' +
                       escapeHtml(p) + '</div>' +
                       '</a>';
            }).join('');

            html += '<section class="folder">' +
                    '<h2 class="folder-title">' + label +
                    ' <span class="count">(' + groups[folder].length +
                    ' trang)</span></h2>' +
                    '<div class="grid">' + cards + '</div></section>';
        });

        if (!html) {
            html = '<p class="empty">Chưa có trang HTML nào trong repo.</p>';
        }

        document.getElementById('sections').innerHTML = html;
        document.getElementById('status').innerHTML =
            'Tổng cộng <b>' + items.length + '</b> trang HTML ' +
            'trong repo <b>' + escapeHtml(owner) + '/' +
            escapeHtml(repo) + '</b>';

        var search = document.getElementById('search');
        search.disabled = false;
        search.focus();
    }

    document.getElementById('search').addEventListener('input', function (e) {
        var q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.card').forEach(function (el) {
            var hay = (el.getAttribute('data-search') || '') +
                      ' ' + el.textContent.toLowerCase();
            el.style.display = hay.indexOf(q) !== -1 ? '' : 'none';
        });
        document.querySelectorAll('.folder').forEach(function (f) {
            var has = Array.prototype.some.call(
                f.querySelectorAll('.card'),
                function (c) { return c.style.display !== 'none'; }
            );
            f.style.display = has ? '' : 'none';
        });
    });

    function showError(msg) {
        document.getElementById('status').innerHTML = '';
        document.getElementById('sections').innerHTML =
            '<div class="error">' +
            '<h3>⚠️ Không thể tải danh sách trang</h3>' +
            '<p>' + msg + '</p>' +
            '<p style="font-size:13px;color:#666">' +
            'Kiểm tra lại <code>CONFIG.owner</code> và ' +
            '<code>CONFIG.repo</code> trong mã nguồn.' +
            '</p></div>';
    }

    function init() {
        fetchTree(CONFIG.owner, CONFIG.repo, CONFIG.branch)
            .then(function (data) {
                var files = (data.tree || [])
                    .filter(function (it) {
                        return it.type === 'blob' &&
                               /\.html?$/i.test(it.path) &&
                               !shouldSkip(it.path);
                    })
                    .map(function (it) { return it.path; });
                render(files, CONFIG.owner, CONFIG.repo);
            })
            .catch(function (err) {
                showError(escapeHtml(err.message));
            });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
