name: Tu dong cap nhat menu HTML

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Tai code ve
        uses: actions/checkout@v4

      - name: Quet tat ca file HTML va tao menu
        run: |
          # Lấy danh sách tất cả file html (trừ index.html và check.html)
          FILES=$(ls *.html 2>/dev/null | grep -v -E '^(index|check)\.html$' | sort)
          
          # Tạo các option menu
          OPTIONS=""
          for f in $FILES; do
            # Lấy tên file bỏ đuôi .html, thay dấu gạch ngang bằng khoảng trắng
            NAME=$(echo "$f" | sed 's/\.html$//' | sed 's/-/ /g')
            OPTIONS="${OPTIONS}            <option value=\"${f}\">${NAME}</option>\n"
          done
          
          echo "=== DANH SACH FILE TIM THAY ==="
          echo "$FILES"
          echo ""
          echo "=== MENU SE TAO ==="
          echo -e "$OPTIONS"
          
          # Lưu vào file tạm để bước sau dùng
          echo -e "$OPTIONS" > /tmp/menu_options.txt

      - name: Cap nhat index.html
        run: |
          # Đọc menu options
          OPTIONS=$(cat /tmp/menu_options.txt)
          
          # Tạo block menu mới
          cat > /tmp/new_menu.txt << 'EOF'
        <select onchange="if(this.value) window.location.href=this.value;" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; background: #f8f9fa; cursor: pointer;">
            <option value="">📁 Kho Thực Đơn & Chuyên Đề Khác...</option>
EOF
          echo -e "$OPTIONS" >> /tmp/new_menu.txt
          echo "        </select>" >> /tmp/new_menu.txt
          
          # Dùng awk để thay thế block <select>...</select>
          awk '
            /<select onchange=/ { skip=1; while ((getline line < "/tmp/new_menu.txt") > 0) print line; next }
            /<\/select>/ { if (skip) { skip=0; next } }
            { print }
          ' index.html > /tmp/new_index.html
          
          mv /tmp/new_index.html index.html
          echo "✅ Đã cập nhật index.html"

      - name: Commit và push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto update menu tu dong [skip ci]"
          git push || echo "Khong co thay doi"
