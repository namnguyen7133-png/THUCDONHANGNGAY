name: Tu dong chay thoi tiet

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Tai code tu repository ve may ao
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai dat thu vien
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Chay file Python
        run: |
          python kiem_tra_thoi_tiet.py

      - name: Tu dong cap nhat lai file len GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update weather db and html files [skip ci]" || exit 0
          git add
