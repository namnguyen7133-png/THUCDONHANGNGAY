name: Cap nhat danh sach file HTML

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Tai code ve
        uses: actions/checkout@v4

      - name: Quet file HTML va tao files.json
        run: |
          {
            echo '{'
            echo '  "files": ['
            FIRST=1
            for f in $(ls *.html 2>/dev/null | grep -v -E '^(index|check)\.html$' | sort); do
              if [ $FIRST -eq 0 ]; then
                echo ','
              fi
              echo "    \"$f\""
              FIRST=0
            done
            echo '  ]'
            echo '}'
          } > files.json

          echo "=== KET QUA ==="
          cat files.json

      - name: Commit files.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --staged --quiet || git commit -m "Auto update files.json [skip ci]"
          git push || echo "Khong co thay doi"
